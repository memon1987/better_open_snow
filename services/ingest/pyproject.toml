[project]
name = "bos-ingest"
version = "0.0.0"
description = "Better Open Snow — data ingest workers"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-firestore>=2.18",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.0",
]

[project.scripts]
bos-ingest = "bos_ingest.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bos_ingest"]
